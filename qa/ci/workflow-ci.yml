name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation reproductible des dépendances
        run: npm ci

      - name: Vérification des règles d'architecture
        run: npm run verifier:architecture

      - name: Tests unitaires & Couverture de code
        run: npm run test:coverage

      - name: Compilation de production Angular
        run: npm run build
