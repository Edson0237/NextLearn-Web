  <rect x="56" y="34" width="74" height="66" rx="8" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-width="3"/>
  <path d="M70 54h46M70 66h32M70 78h20" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".45"/>
