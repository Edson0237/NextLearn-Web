<div class="nl-fatal__icone">
  <nl-icon name="report_problem" [size]="34" />
</div>

<p class="nl-fatal__titre">{{ 'fatalTitre' | t }}</p>
<p class="nl-fatal__corps">
  {{ 'fatalSousTitre' | t }}
</p>

@if (canGoBack()) {
  <button nlButton variant="outline" (click)="back.emit()">{{ 'fatalRetour' | t }}</button>
}

@if (showDetails() && details()) {
  <button type="button" class="nl-fatal__toggle" (click)="detailsVisibles.set(!detailsVisibles())">
    {{ detailsVisibles() ? 'Masquer les détails' : 'Afficher les détails' }}
  </button>

  @if (detailsVisibles()) {
    <pre class="nl-fatal__trace">{{ details() }}</pre>
  }
}
