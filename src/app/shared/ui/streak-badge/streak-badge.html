@if (compact()) {
  <nl-icon class="nl-streak__flamme" name="local_fire_department" [size]="14" />
  <span class="nl-streak__nombre nl-streak__nombre--sm">{{ streak() }}</span>
} @else {
  <nl-icon class="nl-streak__flamme" name="local_fire_department" [size]="22" />
  <span class="nl-streak__texte">
    <span class="nl-streak__nombre">{{ streak() }} {{ 'pwaJoursDeSuite' | t }}</span>
    <span class="nl-streak__encouragement">{{ 'streakEncouragement' | t }}</span>
  </span>
}
