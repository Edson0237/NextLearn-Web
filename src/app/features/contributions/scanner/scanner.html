<nl-page-bar [titre]="'scanTitre' | t" (retour)="retour()" />

<div class="nl-scan">
  <p class="nl-scan__aide">{{ 'scanAide' | t }}</p>

  <!-- Deux entrées : la caméra (sur téléphone, ouvre l'appareil photo), et la
       galerie pour des pages déjà photographiées. -->
  <div class="nl-scan__actions">
    <label class="nl-scan__action nl-scan__action--principale" [class.nl-scan__action--occupee]="occupe()">
      <input type="file" accept="image/*" capture="environment" hidden [disabled]="occupe()" (change)="surFichiers($event)" />
      <nl-icon name="photo_camera" [size]="22" />
      <span>{{ (nombre() === 0 ? 'scanPrendre' : 'scanAjouterPage') | t }}</span>
    </label>
    <label class="nl-scan__action" [class.nl-scan__action--occupee]="occupe()">
      <input type="file" accept="image/*" multiple hidden [disabled]="occupe()" (change)="surFichiers($event)" />
      <nl-icon name="photo_library" [size]="22" />
      <span>{{ 'scanGalerie' | t }}</span>
    </label>
  </div>

  @if (occupe()) {
    <p class="nl-scan__etat" role="status">{{ 'scanTraitement' | t }}</p>
  }

  @if (nombre() > 0) {
    <button
      type="button"
      class="nl-scan__bascule"
      role="switch"
      [attr.aria-checked]="num.ameliorer()"
      [disabled]="occupe()"
      (click)="basculerAmelioration()">
      <span class="nl-scan__bascule-textes">
        <strong>{{ 'scanAmeliorer' | t }}</strong>
        <small>{{ 'scanAmeliorerAide' | t }}</small>
      </span>
      <span class="nl-scan__interrupteur" [class.nl-scan__interrupteur--actif]="num.ameliorer()" aria-hidden="true">
        <span class="nl-scan__interrupteur-pastille"></span>
      </span>
    </button>

    <ol class="nl-scan__pages">
      @for (p of pages(); track p.id; let i = $index) {
        <li class="nl-scan__page">
          <img [src]="p.apercu" [alt]="'scanPageN' | t: { numero: i + 1 }" />
          <span class="nl-scan__numero">{{ i + 1 }}</span>
          <div class="nl-scan__outils">
            @if (i > 0) {
              <button type="button" (click)="monter(i)" [attr.aria-label]="'scanMonter' | t">
                <nl-icon name="chevron_left" [size]="18" />
              </button>
            }
            <button type="button" (click)="tourner(p)" [attr.aria-label]="'scanTourner' | t">
              <nl-icon name="refresh" [size]="18" />
            </button>
            <button type="button" (click)="retirer(p)" [attr.aria-label]="'scanRetirer' | t">
              <nl-icon name="delete" [size]="18" />
            </button>
          </div>
        </li>
      }
    </ol>

    <button type="button" class="nl-scan__terminer" [disabled]="occupe() || assemblage()" (click)="terminer()">
      @if (assemblage()) {
        {{ 'scanAssemblage' | t }}
      } @else {
        {{ 'scanTerminer' | t: { nombre: nombre() } }}
      }
    </button>
  } @else if (!occupe()) {
    <div class="nl-scan__vide">
      <nl-icon name="upload_file" [size]="32" />
      <p>{{ 'scanVide' | t }}</p>
    </div>
  }
</div>
