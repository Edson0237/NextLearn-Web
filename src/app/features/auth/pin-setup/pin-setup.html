<div class="nl-pinset">
  <header class="nl-pinset__entete">
    <button type="button" class="nl-pinset__fermer" (click)="demanderAbandon()" [attr.aria-label]="'otpAbandonQuitter' | t">
      <nl-icon name="close" [size]="20" />
    </button>
    <h1 class="nl-pinset__titre-entete">{{ 'authCreerTonPin' | t }}</h1>
    <div style="margin-left:auto;"><nl-langue-switcher /></div>
  </header>

  <div class="nl-pinset__corps">
    <div class="nl-pinset__pastille">
      <nl-icon name="fingerprint" [size]="28" />
    </div>
    <h2 class="nl-pinset__titre">{{ (confirmant() ? 'pinSetupConfirmeTitre' : 'pinSetupChoisisTitre') | t }}</h2>
    <p class="nl-pinset__texte">
      {{ (confirmant() ? 'pinSetupConfirmeTexte' : 'pinSetupChoisisTexte') | t }}
    </p>

    <nl-pin-input
      [pin]="saisieActuelle()"
      [error]="erreur()"
      [isLoading]="chargement()"
      (digit)="onChiffre($event)"
      (backspace)="onBackspace()"
    />
  </div>
</div>

@if (resultat(); as r) {
  <nl-resultat-pin
    [etat]="r.etat"
    [titre]="r.titre"
    [message]="r.message"
    (termine)="continuer()"
    (reessayer)="reessayer()" />
}
