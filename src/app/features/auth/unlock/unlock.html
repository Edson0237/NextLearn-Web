<div class="nl-unlock">
  <div style="width:100%;display:flex;justify-content:flex-end;margin-bottom:8px;">
    <nl-langue-switcher />
  </div>
  <nl-identite
    class="nl-unlock__avatar"
    [initiales]="initialesAffichees"
    [photoUrl]="photoAffichee"
    [taille]="84" />
  <h1 class="nl-unlock__titre">{{ accroche }}</h1>
  <p class="nl-unlock__texte">{{ 'authEntrePinPourRouvrir' | t }}</p>

  <nl-pin-input
    [pin]="pin()"
    [error]="erreur()"
    [isLoading]="chargement"
    [withBiometric]="biometrieDisponible()"
    (digit)="onChiffre($event)"
    (backspace)="onBackspace()"
    (biometric)="tenterBiometrie()"
  />

  <div class="nl-unlock__pied">
    <button type="button" class="nl-unlock__lien" [disabled]="chargement" (click)="allerReinitialisation()">{{ 'authPinOublie' | t }}</button>
    <button type="button" class="nl-unlock__lien nl-unlock__lien--discret" [disabled]="chargement" (click)="changerDeCompte()">{{ 'authCeNestPasMoi' | t }}</button>
  </div>
</div>

@if (resultat(); as r) {
  <nl-resultat-pin
    [etat]="r.etat"
    [titre]="r.titre"
    [message]="r.message"
    (termine)="continuer()"
    (reessayer)="reessayer()" />
}
