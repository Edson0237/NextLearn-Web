<div class="notifs">
  <header class="notifs__entete">
    <button class="nl-icon-btn" (click)="goBack()" [attr.aria-label]="'actionRetour' | t">
      <nl-icon name="arrow_back" />
    </button>
    <h1 class="notifs__titre">{{ 'homeNotifications' | t }}</h1>
    @if (notifications().some((n) => !n.lu)) {
      <button class="notifs__mark-all" (click)="markAllAsRead()">{{ 'pwaToutLire' | t }}</button>
    }
  </header>

  <div class="notifs__corps">
    @if (loading()) {
      <p class="notifs__etat">{{ 'chargementEnCours' | t }}</p>
    } @else if (error()) {
      <div class="notifs__etat notifs__etat--erreur">
        <p>{{ error() }}</p>
        <button nlButton variant="primary" size="sm" (click)="load()">{{ 'actionReessayer' | t }}</button>
      </div>
    } @else if (notifications().length === 0) {
      <nl-empty-state
        icon="notifications"
        [title]="'notifsAucune' | t"
        [subtitle]="'pwaVousEtesAJour' | t" />
    } @else {
      <div class="notifs__liste">
        @for (n of notifications(); track n.id; let i = $index) {
          <button [nlCascadeEnter]="i"
            class="notifs__item"
            [class.notifs__item--unread]="!n.lu"
            (click)="open(n)">
            <span class="notifs__vignette" aria-hidden="true">
              <nl-icon [name]="iconeDe(n)" [size]="20" />
            </span>
            <div class="notifs__content">
              <span class="notifs__categorie">{{ libelleCategorie(n) }}</span>
              <span class="notifs__title">{{ n.titre }}</span>
              <span class="notifs__message">{{ n.corps }}</span>
              <span class="notifs__date">{{ quand(n.createdAt) }}</span>
            </div>
            @if (!n.lu) {
              <span class="notifs__dot" [attr.aria-label]="'notifsNonLue' | t"></span>
            }
          </button>
        }
      </div>
    }
  </div>
</div>
