<div class="legal">
  <header class="legal__entete">
    <button class="nl-icon-btn" (click)="goBack()" [attr.aria-label]="'actionRetour' | t">
      <nl-icon name="arrow_back" />
    </button>
    <h1 class="legal__titre">{{ titleKey() | t }}</h1>
  </header>

  <div class="legal__corps">
    @if (src(); as url) {
      <iframe class="legal__frame" [src]="url" [title]="titleKey() | t"></iframe>
    } @else {
      <p class="legal__etat">{{ 'pwaDocumentInconnu' | t }}</p>
    }
  </div>
</div>
