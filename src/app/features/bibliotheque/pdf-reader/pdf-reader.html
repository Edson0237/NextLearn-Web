<div class="pdf-reader">
  <header class="pdf-reader__barre">
    <button class="nl-icon-btn" (click)="goBack()" [attr.aria-label]="'actionRetour' | t">
      <nl-icon name="arrow_back" />
    </button>
    <span class="pdf-reader__titre">
      @if (totalPages() > 0) {
        Page {{ page() }} / {{ totalPages() }}
      } @else {
        Lecture
      }
    </span>
    <button class="nl-icon-btn" (click)="openInNewTab()" [attr.aria-label]="'pwaOuvrirNouvelOnglet' | t">
      <nl-icon name="open_in_new" />
    </button>
  </header>

  @if (loading()) {
    <p class="pdf-reader__etat">{{ 'pdfChargement' | t }}</p>
  } @else if (error()) {
    <div class="pdf-reader__etat pdf-reader__etat--erreur">
      <p>{{ error() }}</p>
    </div>
  } @else if (url()) {
    <div class="pdf-reader__viewport">
      @if (format() === 'docx') {
        <nl-docx-viewer
          [url]="url()"
          [pageInitiale]="page()"
          (pageChange)="surChangementDePage($event)"
          (totalCount)="surTotalPagesDocx($event)"
          (erreur)="onDocxError($event)"
        />
      } @else {
        @if (fallback()) {
          <iframe
            class="pdf-reader__frame"
            [src]="safeUrl()"
            [attr.title]="'pwaLecteurPdf' | t"
            allowfullscreen></iframe>
        } @else {
          <pdf-viewer
            [src]="url()"
            [page]="page()"
            [render-text]="true"
            [original-size]="false"
            [fit-to-page]="false"
            [autoresize]="true"
            [show-all]="true"
            style="width: 100%; height: 100%;"
            (onError)="onError($event)"
            (after-load-complete)="onLoaded($event)"
            (pageChange)="surChangementDePage($event)"
          />
        }
      }
    </div>
  }
</div>
