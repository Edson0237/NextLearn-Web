<div class="pdf-reader">
  <header class="pdf-reader__barre">
    <button class="nl-icon-btn" (click)="goBack()" aria-label="Retour">
      <nl-icon name="arrow_back" />
    </button>
    <span class="pdf-reader__titre">Lecture</span>
    <button class="nl-icon-btn" (click)="openInNewTab()" aria-label="Ouvrir dans un nouvel onglet">
      <nl-icon name="open_in_new" />
    </button>
  </header>

  @if (loading()) {
    <p class="pdf-reader__etat">Chargement du document…</p>
  } @else if (error()) {
    <div class="pdf-reader__etat pdf-reader__etat--erreur">
      <p>{{ error() }}</p>
    </div>
  } @else if (url()) {
    <iframe
      class="pdf-reader__frame"
      [src]="url()"
      title="Lecteur PDF"
      allowfullscreen></iframe>
  }
</div>
