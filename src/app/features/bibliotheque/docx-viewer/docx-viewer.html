<div class="nl-docx-viewer">
  @if (chargement()) {
    <div class="nl-docx-viewer__chargement">
      <span class="nl-docx-viewer__spinner"></span>
      <p class="nl-docx-viewer__etat">{{ 'pdfChargement' | t }}</p>
    </div>
  } @else if (messageErreur(); as err) {
    <div class="nl-docx-viewer__etat nl-docx-viewer__etat--erreur">
      <p>{{ err }}</p>
    </div>
  }

  <div
    #docxContainer
    class="nl-docx-viewer__conteneur"
    [class.nl-docx-viewer__conteneur--masque]="chargement() || !!messageErreur()"
    tabindex="0"
    role="region"
    aria-label="Document Word">
  </div>
</div>
