<div class="matiere">
  <header class="matiere__entete">
    <button class="nl-icon-btn" (click)="goBack()" [attr.aria-label]="'actionRetour' | t">
      <nl-icon name="arrow_back" />
    </button>
    <div class="matiere__titre-wrap">
      <h1 class="matiere__titre">{{ matiereNom() }}</h1>
      <p class="matiere__sous-titre">{{ filtered().length }} document{{ filtered().length > 1 ? 's' : '' }}</p>
    </div>
  </header>

  <div class="matiere__corps">
    @if (loading()) {
      <p class="matiere__etat">{{ 'chargementEnCours' | t }}</p>
    } @else if (error()) {
      <div class="matiere__etat matiere__etat--erreur">
        <p>{{ error() }}</p>
        <button nlButton variant="primary" size="sm" (click)="load()">{{ 'actionReessayer' | t }}</button>
      </div>
    } @else if (filtered().length === 0) {
      <nl-empty-state
        icon="description"
        [title]="'pwaAucunDocument' | t"
        [subtitle]="'pwaMatiereSansDocument' | t" />
    } @else {
      <div class="matiere__liste">
        @for (doc of filtered(); track doc.id; let i = $index) {
          <nl-document-card [nlCascadeEnter]="i"
            [documentId]="doc.id"
            [title]="doc.titre"
            [subject]="doc.matiere"
            [typeLabel]="(doc.type | typeDoc).label"
            [typeIcon]="(doc.type | typeDoc).icone"
            [typeColor]="(doc.type | typeDoc).couleur"
            [meta]="metaFor(doc)"
            [note]="noteFor(doc)"
            (activate)="openDocument(doc)" />
        }
      </div>
    }
  </div>
</div>
