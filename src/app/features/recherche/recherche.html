<div class="recherche">
  <header class="recherche__entete">
    <button class="nl-icon-btn" (click)="goBack()" aria-label="Retour">
      <nl-icon name="arrow_back" />
    </button>
    <div class="recherche__field">
      <nl-icon name="search" />
      <input
        type="text"
        placeholder="Rechercher un document, une matière…"
        [(ngModel)]="query"
        aria-label="Rechercher" />
    </div>
  </header>

  <div class="recherche__corps">
    @if (query().trim().length === 0) {
      <p class="recherche__hint">Commencez à taper pour chercher parmi les documents.</p>
    } @else if (loading()) {
      <p class="recherche__etat">Recherche…</p>
    } @else if (error()) {
      <div class="recherche__etat recherche__etat--erreur">
        <p>{{ error() }}</p>
      </div>
    } @else if (results().length === 0) {
      <nl-empty-state
        icon="search"
        title="Aucun résultat"
        subtitle="Essayez un autre terme." />
    } @else {
      <div class="recherche__liste">
        @for (doc of results(); track doc.id) {
          <nl-document-card
            [title]="doc.titre"
            [subject]="doc.matiere"
            [typeLabel]="typeLabel(doc.type)"
            [typeIcon]="typeIcon(doc.type)"
            [typeColor]="typeColor(doc.type)"
            [meta]="metaFor(doc)"
            (activate)="openDocument(doc)" />
        }
      </div>
    }
  </div>
</div>
