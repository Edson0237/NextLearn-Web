<nl-section-prompt-modal />

<div class="nl-shell__corps">
  <router-outlet />
</div>

<nav class="nl-shell__barre" [attr.aria-label]="'pwaNavigationPrincipale' | t">
  @for (onglet of onglets(); track onglet.route) {
    <a
      [routerLink]="['/app', onglet.route]"
      routerLinkActive="nl-shell__onglet--actif"
      #lien="routerLinkActive"
      class="nl-shell__onglet"
      [attr.aria-label]="onglet.label"
      [attr.aria-current]="lien.isActive ? 'page' : null"
      (click)="surTap()"
    >
      <!-- Le libellé quitte l'écran mais pas l'arbre d'accessibilité :
           `aria-label` le porte, et c'est lui que lit un lecteur d'écran.
           Cinq icônes sans texte ne se devinent pas autrement. -->
      <span class="nl-shell__pastille">
        <nl-icon [name]="lien.isActive ? onglet.iconActif : onglet.icon" [size]="24" />
      </span>
      @if (onglet.compte && onglet.compte() > 0) {
        <span class="nl-shell__compte">{{ onglet.compte() }}</span>
      }
    </a>
  }
</nav>
